name: Issue Comment

on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  issue-labeled:
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Reply to labeled issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { issue, label } = context.payload;
            const mention = `@${issue.user.login}`;
            const usage = `Hello ${mention}, Thanks for your using ChuanSuo. It is recommended that you first check whether the corresponding document can solve your feedback.

            你好 ${mention}，感谢您使用穿梭，建议您首先查看对应的文档是否可以解决您的反馈。`;
            const replies = new Map([
              ['feature', `Hello ${mention}, thanks for your suggestions. We will have someone to follow up your suggestions.

            你好 ${mention}，感谢提交建议！我们会有专人来跟踪该建议。`],
              ['bug', `Hello ${mention}, thanks for your feedback. We will have someone to follow up your feedback.

            你好 ${mention}，感谢提交反馈！我们会有专人来跟踪该反馈。`],
              ['help wanted', `Sorry ${mention}, we do not have a good solution now. welcome to [send us a Pull Request](https://help.github.com/en/articles/creating-a-pull-request) for it. Make sure CI passed, we will review it soon. We appreciate your effort in advance and looking forward to your contribution!

            抱歉 ${mention}，目前，我们并没有很好地解决方法！欢迎直接在此仓库 [创建一个 Pull Request](https://help.github.com/en/articles/creating-a-pull-request) 来帮助我们解决这个问题。确保 CI 通过，我们会尽快进行 Review，提前感谢和期待您的贡献。`],
              ['reproduce', `Hello ${mention}， we can not reproduce you feedback.Please provide a reproduction in order to address the issue.

            你好 ${mention}, 我们未能复现你的反馈。请提供一个复现步骤以便于我们排查问题。`],
              ['usage', usage],
              ['question', usage],
              ['invalid', `Hello ${mention}, your issue has been closed because it does not conform to our issue requirements. Please use the issue template to create an issue, thank you!

            你好 ${mention}，为了能够进行高效沟通，我们对 issue 有一定的格式要求，你的 issue 因为不符合要求而被自动关闭。请务必根据 issue 模板来创建 issue，以方便我们定位问题，谢谢！`],
            ]);

            const labelName = label.name.toLowerCase();
            const body = replies.get(labelName);
            if (!body) return;

            const target = { ...context.repo, issue_number: issue.number };
            await github.rest.issues.createComment({ ...target, body: `${body}\n` });

            if (labelName === 'invalid') {
              await github.rest.issues.update({ ...target, state: 'closed' });
            }
