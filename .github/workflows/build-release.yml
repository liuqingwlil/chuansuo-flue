name: Build Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager "platforms;android-32" "build-tools;36.0.0"
      - name: Configure release build
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          test -n "$MAPS_API_KEY" || { echo "::error::MAPS_API_KEY is required for a release"; exit 1; }
          printf 'MAPS_API_KEY=%s\nGITHUB_REPOSITORY=%s\n' "$MAPS_API_KEY" "$GITHUB_REPOSITORY" > local.properties
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleRelease lintRelease --console=plain
      - name: Sign the standard release
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY" && test -n "$ALIAS" && test -n "$KEY_STORE_PASSWORD" && test -n "$KEY_PASSWORD" \
            || { echo "::error::Release signing secrets are required"; exit 1; }
          umask 077
          keystore="$RUNNER_TEMP/chuansuo.keystore"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$keystore"
          mkdir -p release-artifacts
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*_release.apk)
          test "${#apks[@]}" -eq 1 || { echo "::error::Expected one standard release APK"; exit 1; }
          apk="${apks[0]}"
          name=$(basename "$apk" .apk)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            expected_tag="v${name#ChuanSuo_}"
            test "$GITHUB_REF_NAME" = "${expected_tag%_arm64-v8a_release}" || { echo "::error::Tag does not match the APK version"; exit 1; }
          fi
          output="release-artifacts/${name}_signed.apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" sign --ks "$keystore" --ks-key-alias "$ALIAS" --ks-pass env:KEY_STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$output" "$apk"
          "$apksigner" verify "$output"
      - uses: actions/upload-artifact@v4
        with:
          name: ChuanSuo-release
          path: release-artifacts/*.apk
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2.3.2
        with:
          generate_release_notes: true
          files: release-artifacts/*.apk
          fail_on_unmatched_files: true
